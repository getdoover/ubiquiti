# Local run against REAL hardware on your LAN. There is no radio simulator —
# development is done against a Bullet on the bench.
#
# NOTE: on macOS, `network_mode: host` does not give the container real L2 access,
# so discovery will not work in Docker Desktop. On a Mac, drive the bench CLI
# natively instead (`uv run airos discover --iface en0`) and run the container on
# a Linux box or the Doovit. See DEVELOPMENT.md.
services:
  ubiquiti_airmax:
    build:
      context: ..
      dockerfile: Dockerfile
    network_mode: host
    cap_add:
      - NET_ADMIN
    environment:
      - APP_KEY=ubiquiti_airmax-1
      - HEALTHCHECK_PORT=8080
      - CONFIG_FP=/app/simulators/app_config.json
    volumes:
      - ./app_config.json:/app/simulators/app_config.json:ro
