[project]
name = "ubiquiti-common"
version = "0.1.0"
description = "Shared discovery / airOS driver code for the Ubiquiti Doover apps"
requires-python = ">=3.11"
dependencies = [
    "asyncssh>=2.14.2",
    "jinja2>=3.1.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ubiquiti_common"]
